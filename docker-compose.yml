services:
  backend:
    build: ./backend
    container_name: womanly_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=womanly
      - DATABASE_URL=postgresql://user:password@db:5432/womanly
      - READ_DATABASE_URL=postgresql://user:password@db:5432/womanly
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=REDACTED_SECRET_KEY
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - FRONTEND_URL=http://localhost:5173
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - SMTP_HOST=smtp.resend.com
      - SMTP_PORT=587
      - SMTP_USER=resend
      - SMTP_PASSWORD=REDACTED_RESEND_API_KEY
      - SMTP_FROM=onboarding@resend.dev
      - SENTRY_DSN=REDACTED_SENTRY_DSN
      - SENTRY_ENVIRONMENT=dev
      - SENTRY_TRACES_SAMPLE_RATE=1.0
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: womanly_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-womanly}
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: womanly_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
