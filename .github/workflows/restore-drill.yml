name: Restore Drill

on:
  schedule:
    - cron: "45 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Run remote restore drill
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE || '.env.staging' }}
          STAGING_BACKUP_DIR: ${{ secrets.STAGING_BACKUP_DIR || 'backups' }}
          RESTORE_DRILL_BACKUP_FILE: ${{ secrets.RESTORE_DRILL_BACKUP_FILE }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || '22' }}
          envs: STAGING_APP_DIR,STAGING_ENV_FILE,STAGING_BACKUP_DIR,RESTORE_DRILL_BACKUP_FILE
          script_stop: true
          script: |
            set -euo pipefail
            cd "${STAGING_APP_DIR}"
            chmod +x scripts/restore_drill.sh
            scripts/restore_drill.sh "${STAGING_ENV_FILE}" "${STAGING_BACKUP_DIR}" "${RESTORE_DRILL_BACKUP_FILE}"

      - name: Fetch restore drill evidence
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || '22' }}
          source: "${{ secrets.STAGING_APP_DIR }}/${{ secrets.STAGING_BACKUP_DIR || 'backups' }}/restore-drill-evidence.txt"
          target: "./restore-drill-evidence"
          strip_components: 0

      - name: Upload restore drill evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-evidence
          path: "restore-drill-evidence/**/restore-drill-evidence.txt"