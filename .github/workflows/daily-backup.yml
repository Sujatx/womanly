name: Daily Backup

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Run remote backup and upload
        id: backup
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE || '.env.staging' }}
          STAGING_BACKUP_DIR: ${{ secrets.STAGING_BACKUP_DIR || 'backups' }}
          STAGING_BACKUP_RETENTION_DAYS: ${{ secrets.STAGING_BACKUP_RETENTION_DAYS || '30' }}
          BACKUP_UPLOAD_COMMAND: ${{ secrets.BACKUP_UPLOAD_COMMAND }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || '22' }}
          envs: STAGING_APP_DIR,STAGING_ENV_FILE,STAGING_BACKUP_DIR,STAGING_BACKUP_RETENTION_DAYS,BACKUP_UPLOAD_COMMAND
          script_stop: true
          script: |
            set -euo pipefail

            if [[ -z "${BACKUP_UPLOAD_COMMAND}" ]]; then
              echo "BACKUP_UPLOAD_COMMAND secret is required for encrypted off-site upload"
              exit 1
            fi

            cd "${STAGING_APP_DIR}"
            chmod +x scripts/backup_db.sh

            scripts/backup_db.sh "${STAGING_ENV_FILE}" "${STAGING_BACKUP_DIR}" "${STAGING_BACKUP_RETENTION_DAYS}"

            LATEST_BACKUP=$(ls -1t "${STAGING_BACKUP_DIR}"/womanly_*.sqlc | head -n 1)
            LATEST_SUM="${LATEST_BACKUP}.sha256"

            {
              echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "backup_file=${LATEST_BACKUP}"
              echo "backup_size_bytes=$(stat -c%s "${LATEST_BACKUP}")"
              echo "sha256=$(cut -d ' ' -f1 "${LATEST_SUM}")"
              echo "retention_days=${STAGING_BACKUP_RETENTION_DAYS}"
            } > "${STAGING_BACKUP_DIR}/last-backup-evidence.txt"

      - name: Fetch backup evidence
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || '22' }}
          source: "${{ secrets.STAGING_APP_DIR }}/${{ secrets.STAGING_BACKUP_DIR || 'backups' }}/last-backup-evidence.txt"
          target: "./backup-evidence"
          strip_components: 0

      - name: Upload backup evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-backup-evidence
          path: "backup-evidence/**/last-backup-evidence.txt"
