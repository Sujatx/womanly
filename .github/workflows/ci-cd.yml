name: CI-CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENV_NAME: ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: womanly
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/womanly
      READ_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/womanly
      SECRET_KEY: ci-secret-key
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare CI env file
        run: cp .env.ci .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Static compile check
        run: python -m compileall app

      - name: Backend tests
        run: pytest -q

      - name: Validate Alembic migrations (render SQL)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: alembic -c alembic.ini upgrade head --sql

      - name: Python dependency audit
        run: pip-audit

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Node dependency audit (high+)
        run: npm audit --audit-level=high

  build-images:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    outputs:
      image_tag: ${{ steps.vars.outputs.IMAGE_TAG }}
      image_registry: ${{ steps.vars.outputs.IMAGE_REGISTRY }}
      backend_image: ${{ steps.vars.outputs.BACKEND_IMAGE }}
      frontend_image: ${{ steps.vars.outputs.FRONTEND_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag format
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag format: ${TAG_NAME}"
              echo "Expected format: vMAJOR.MINOR.PATCH (for example v1.2.3)"
              exit 1
            fi
          fi

      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REGISTRY="ghcr.io/${OWNER_LOWER}"
          BACKEND_IMAGE="${IMAGE_REGISTRY}/womanly-backend"
          FRONTEND_IMAGE="${IMAGE_REGISTRY}/womanly-frontend"

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY}" >> $GITHUB_OUTPUT
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_OUTPUT
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t ${{ steps.vars.outputs.BACKEND_IMAGE }}:${{ steps.vars.outputs.IMAGE_TAG }} \
            -t ${{ steps.vars.outputs.BACKEND_IMAGE }}:${{ steps.vars.outputs.IMAGE_SHA }} \
            backend
          docker push ${{ steps.vars.outputs.BACKEND_IMAGE }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ${{ steps.vars.outputs.BACKEND_IMAGE }}:${{ steps.vars.outputs.IMAGE_SHA }}

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            -t ${{ steps.vars.outputs.FRONTEND_IMAGE }}:${{ steps.vars.outputs.IMAGE_TAG }} \
            -t ${{ steps.vars.outputs.FRONTEND_IMAGE }}:${{ steps.vars.outputs.IMAGE_SHA }} \
            frontend
          docker push ${{ steps.vars.outputs.FRONTEND_IMAGE }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ${{ steps.vars.outputs.FRONTEND_IMAGE }}:${{ steps.vars.outputs.IMAGE_SHA }}

