name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Static compile check
        run: python -m compileall app

      - name: Run tests if present
        run: |
          if compgen -G "tests/**/*.py" > /dev/null; then
            pytest -q
          else
            echo "No backend tests found; skipping pytest"
          fi

      - name: Python dependency audit
        run: pip-audit

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Node dependency audit (high+)
        run: npm audit --audit-level=high

  build-images:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod -t womanly-backend:${{ steps.vars.outputs.IMAGE_TAG }} backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod -t womanly-frontend:${{ steps.vars.outputs.IMAGE_TAG }} frontend

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-images]
    environment:
      name: staging
    steps:
      - name: Placeholder deploy step
        run: |
          echo "Add staging deployment command (SSH, ECS, or Kubernetes)"
          echo "This workflow already gates deployment on successful checks and image builds."

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
    steps:
      - name: Placeholder production deploy (manual approval required by environment rules)
        run: |
          echo "Configure protected environment approvals and deployment command here."
